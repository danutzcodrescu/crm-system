name: CRM CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TZ: UTC

jobs:
  smoke:
    name: TypeScript, tooling and smoke tests
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      SMOKE_POSTGRES_IMAGE: postgres:17
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Test development dependency optimizer
        run: pnpm test:tooling
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check municipality hydration across browser locales
        run: pnpm test:hydration
      - name: Run seeded route smoke tests
        # Testcontainers builds Dockerfile.db, applies migrations and synthetic
        # seed data, and tears down its own database. Never uses a real backup.
        run: pnpm test:smoke
      - name: Upload browser reports and server/database logs
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: smoke-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Production Docker image
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production image
        # Dockerfile runs type checks, production compilation and dependency
        # pruning. Build locally only: no publishing, deployment or credentials.
        run: |
          mkdir -p build-logs
          docker build --pull --platform linux/amd64 --progress plain --tag crm-system:ci . 2>&1 | tee build-logs/docker-build.log
      - name: Check production runtime and native dependencies
        run: |
          docker run --rm -i --entrypoint node crm-system:ci --input-type=module \
            < e2e/support/docker-runtime-probe.mjs 2>&1 | tee build-logs/docker-runtime.log
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test the compiled production image
        env:
          CRM_SMOKE_IMAGE: crm-system:ci
          CRM_SMOKE_PLATFORM: linux/amd64
          SMOKE_POSTGRES_IMAGE: postgres:17
          SMOKE_LOG_DIR: build-logs/docker-smoke
        run: pnpm test:smoke
      - name: Upload Docker build, runtime and browser logs
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: docker-build-logs
          path: |
            build-logs/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
